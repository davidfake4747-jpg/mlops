<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма ввода чисел</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        
        .form-container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Введите параметры квартиры</h2>
        <form id="numberForm">
            <input type="number" id="num1" min="0.01" step="any" placeholder="Площадь квартиры, м2" required>
            <input type="number" id="num2" min="0" step="1" placeholder="Количество комнат (0 — студия)" required>
            <input type="number" id="num3" min="1" step="1" placeholder="Этажей в доме" required>
            <input type="number" id="num4" min="1" step="1" placeholder="Этаж квартиры" required>
            <input type="password" id="token" placeholder="Секретный токен" required>
            <button type="submit">Отправить</button>
        </form>
        <div id="response"></div>
    </div>

    <script>
        document.getElementById('numberForm').addEventListener('submit', function(event) {
            event.preventDefault();
            submitForm();
        });

        function submitForm() {
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;
            const num3 = document.getElementById('num3').value;
            const num4 = document.getElementById('num4').value;
            const token = document.getElementById('token').value;

            const data = {
                area: num1,
                rooms: num2,
                total_floors: num3,
                floor: num4
            };

            fetch('/api/numbers', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if(data['status'] == 'success'){
                    const price = parseInt(data['data']);
                    if(price > 0){
                        const price_millions = parseInt(price / 1000_000);
                        const price_thousands = parseInt((price % 1000_000) / 1000);
                        document.getElementById('response').innerText = 'Примерная цена: ' + price_millions + ' млн ' + price_thousands + ' тыc руб.';
                    } else {
                        document.getElementById('response').innerText = 'Предсказана отрицательная цена.'
                    }
               } else {
                    document.getElementById('response').innerText = data.data || 'Ошибка при обработке данных на сервере';
                }
                
            })
            .catch(error => {
                console.error('Ошибка:', error);
                document.getElementById('response').innerText = 'Произошла ошибка при отправке данных';
            });
        }
    </script>
</body>
</html>
